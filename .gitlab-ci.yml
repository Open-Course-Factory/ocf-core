# ============================================================================
# Workflow rules — avoid duplicate pipelines
# When an MR is open for a branch, only the MR pipeline runs (skip the
# branch-push pipeline that would duplicate the same tests).
# ============================================================================

workflow:
  rules:
    # Tags always run (release pipelines)
    - if: $CI_COMMIT_TAG
    # MR events always run
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Skip branch-push pipelines when an MR is open for that branch
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Plain branch push (no MR) still runs — e.g. main after merge
    - if: $CI_COMMIT_BRANCH

default:
  tags:
    - labinux
  # A newer pipeline on the same ref cancels this one (auto-cancel redundant
  # pipelines is on for the project), so a burst of pushes queues only the latest.
  interruptible: true
  # Docker Hub pulls fail under load (TLS handshake or token timeouts); retry once.
  retry:
    max: 1
    when:
      - runner_system_failure

# ============================================================================
# Variables
# ============================================================================

variables:
  # Build configuration
  GO_VERSION: "1.27-trixie"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  GOPROXY: "https://proxy.golang.org,direct"

  # PostgreSQL configuration (shared across test jobs)
  POSTGRES_DB: ocf_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "postgrespass"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: disable

# ============================================================================
# Stages
# ============================================================================

stages:
  - prepare  # Build CI images (only when their inputs change)
  - test     # All test suites (unit, integration, race, auth) — MUST pass before tagging
  - build    # Docker image: :$CI_COMMIT_SHA on main, retagged on release tags
  - release  # Version auto-tagging (main, after the build) and release creation

# ============================================================================
# Base Job Templates
# ============================================================================

.test_job_base:
  stage: test
  # The labinux runner pulls images with pull_policy if-not-present.
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/golang:${GO_VERSION}
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.go/cache
  # The labinux runner binds /cache to one host directory for all concurrent slots,
  # so every job sees the cache the previous one pushed. Compiling dominates these jobs.
  cache:
    key:
      prefix: go-
      files: [go.sum]
    paths:
      - .go/pkg/mod
      - .go/cache
  before_script:
    - export PATH=$PATH:$GOPATH/bin
    - go mod download
    # Pinned so a rerun installs the same tools.
    - go install github.com/jstemmer/go-junit-report/v2@v2.1.0
    - go install github.com/swaggo/swag/cmd/swag@v1.16.6
    - swag init --parseDependency --parseInternal --quiet
  artifacts:
    expire_in: 1 week
  rules: !reference [.code_change_rules, rules]
  needs: []  # Run in parallel with other test jobs

# Test jobs run on MRs and manual pipelines, except MRs that only touch VERSION
# (release MRs): their code was tested on the MR that brought it to main (#570).
.code_change_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        # Every path except the top-level VERSION file (complement, not an allow-list):
        # any file in a subdirectory, plus any top-level name other than exactly VERSION.
        - "*/**/*"
        - "{[!V]*,V,V[!E]*,VE[!R]*,VER[!S]*,VERS[!I]*,VERSI[!O]*,VERSIO[!N]*,VERSION?*}"
    - if: $CI_PIPELINE_SOURCE == "web"  # Manual trigger

# NOTE: .postgres_test_base removed — unit tests use in-memory SQLite.
# PostgreSQL is only needed for integration tests (test:auth job, as a service).

# ============================================================================
# Release Component
# ============================================================================

include:
  - component: usine.solution-libre.fr/gitlab/components/release/default@0.4.0
    inputs:
      # Enable all new features
      enable_version_check: true
      enable_docker_build: true
      enable_enhanced_release_notes: true

      # Configure stages to match our pipeline. check-version runs after the
      # build: the version tag only appears once :$CI_COMMIT_SHA is pushed, so
      # its pipeline retags instead of rebuilding, and a failed build tags nothing.
      check_stage: release
      build_stage: build
      stage: release

      # Version management
      version_file: "VERSION"
      main_branch: "main"
      tag_prefix: "v"

      # Docker build
      dockerfile_path: "Dockerfile"
      build_context: "."
      # Build on the runner's persistent buildkitd; build once on main, retag on tags
      buildkit_endpoint: "unix:///run/buildkit/buildkitd.sock"
      build_on_main: true

      # Disable old changelog component (using enhanced notes instead)
      disable_changelog: true

# ============================================================================
# Prepare Stage — build CI images when their Dockerfiles change
# ============================================================================

# Casdoor with the test config and init data baked in, and the MySQL it already
# initialised (schema + init data), both run by test:auth as services.
# Rebuilt when an input changes; the job definition itself is an input (build arg).
.casdoor_test_inputs: &casdoor_test_inputs
  - Dockerfile.casdoor
  - init_data.json
  - wait-for-mysql.sh
  - scripts/ci/build-casdoor-db-test.sh
  - src/configuration/casdoor_app_test.conf
  - .gitlab-ci.yml

build:casdoor-test-image:
  stage: prepare
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    CASDOOR_TEST_IMAGE: ${CI_REGISTRY_IMAGE}/casdoor-test
    CASDOOR_DB_TEST_IMAGE: ${CI_REGISTRY_IMAGE}/casdoor-db-test
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -f Dockerfile.casdoor --build-arg CONFIG_FILE=src/configuration/casdoor_app_test.conf -t $CASDOOR_TEST_IMAGE:$CI_COMMIT_SHA .
    - sh scripts/ci/build-casdoor-db-test.sh $CASDOOR_TEST_IMAGE:$CI_COMMIT_SHA $CASDOOR_DB_TEST_IMAGE:$CI_COMMIT_SHA
    - docker push $CASDOOR_TEST_IMAGE:$CI_COMMIT_SHA
    - docker push $CASDOOR_DB_TEST_IMAGE:$CI_COMMIT_SHA
    # Only main moves latest, so an MR never changes the images other MRs test against.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        for image in $CASDOOR_TEST_IMAGE $CASDOOR_DB_TEST_IMAGE; do
          docker tag $image:$CI_COMMIT_SHA $image:latest
          docker push $image:latest
        done
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *casdoor_test_inputs
    - if: $CI_PIPELINE_SOURCE == "web"

# ============================================================================
# Test Stage
# ============================================================================

# All unit tests in a single job: coverage + short mode
# Runs every test in tests/ and src/ except those behind //go:build integration
# No external services required (uses in-memory SQLite)
test:unit:
  extends: .test_job_base
  script:
    - echo "🧪 Running all unit tests with coverage..."
    # Full -v output goes to the tests.log artifact only (it exceeds the 4 MB job-log limit).
    # Build covdata once, serially: parallel test binaries building it race on ETXTBSY.
    - go tool -n covdata > /dev/null
    - go test -v -short -count=1 -coverprofile=coverage.out -timeout=120s ./tests/... ./src/... > tests.log 2>&1 || TEST_RC=$?
    # Job log: package results, the full output of failing packages, compile errors.
    - |
      awk '/^(ok|FAIL|\?)[ \t]/ { if ($1 == "FAIL") for (i = 0; i < n; i++) print buf[i]; print; n = 0; next }
           /\.go:[0-9]+:[0-9]+: / { print; next }
           { buf[n++] = $0 }' tests.log
    - go-junit-report -in tests.log -set-exit-code > report.xml || TEST_RC=${TEST_RC:-1}
    - go tool cover -func=coverage.out | tail -1 || true
    - exit ${TEST_RC:-0}

  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - coverage.out
      - report.xml
      - tests.log
    expire_in: 1 week

# Integration tests for Casdoor authentication flow (//go:build integration).
# PostgreSQL, MySQL and Casdoor run as job services: each job gets its own stack
# on its own network, so jobs run in parallel without sharing state.
test:auth:
  extends: .test_job_base
  needs:
    - job: build:casdoor-test-image
      optional: true  # Absent when no Casdoor input changed: latest is used
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:16
      alias: postgres-test
    # latest moves; an if-not-present runner would keep a stale copy.
    - name: ${CI_REGISTRY_IMAGE}/casdoor-db-test:${CASDOOR_TEST_TAG}
      alias: casdoor-db-test
      pull_policy: always
    - name: ${CI_REGISTRY_IMAGE}/casdoor-test:${CASDOOR_TEST_TAG}
      alias: casdoor-test
      pull_policy: always
  variables:
    # Services reach each other by alias (Casdoor -> casdoor-db-test) only on a per-build network.
    FF_NETWORK_PER_BUILD: "true"
    CASDOOR_TEST_TAG: latest
    # Service logs in the job log, to see why Casdoor or MySQL died.
    CI_DEBUG_SERVICES: "true"
    RUNNING_IN_DOCKER: "true"
    # The other POSTGRES_* globals configure both the postgres service and the tests.
    POSTGRES_HOST: postgres-test
    CASDOOR_ENDPOINT: "http://casdoor-test:8000"
  # test:unit is the only cache writer.
  cache:
    policy: pull
  before_script:
    - export PATH=$PATH:$GOPATH/bin
    # JWT certificate from a GitLab CI variable (test certificate for auth tests)
    - echo $token_jwt_key_test | base64 -d > ./src/auth/casdoor/token_jwt_key.pem
    - go install github.com/jstemmer/go-junit-report/v2@v2.1.0
    # Compile while the services start; -exec true skips running TestMain, which needs them.
    - go test -tags integration -count=1 -exec true ./tests/auth/...
    # GitLab only waits for open ports; Casdoor answering means MySQL is up too.
    - |
      echo "Waiting for PostgreSQL and Casdoor..."
      timeout 300 bash -c 'until (echo > /dev/tcp/postgres-test/5432) 2>/dev/null && curl -fsS -o /dev/null http://casdoor-test:8000/api/get-account; do sleep 2; done' \
        || { echo "Services not ready after 300 s"; exit 1; }
      echo "Services ready"
  script:
    - go test -v -tags integration -count=1 -timeout=120s ./tests/auth/... > auth_tests.log 2>&1 || TEST_RC=$?
    - cat auth_tests.log
    - go-junit-report -in auth_tests.log -set-exit-code > auth_report.xml || TEST_RC=${TEST_RC:-1}
    - exit ${TEST_RC:-0}
  artifacts:
    when: always
    reports:
      junit: auth_report.xml
    paths:
      - auth_report.xml
      - auth_tests.log
    expire_in: 1 week
  rules:
    # A Casdoor input changed: use the images build:casdoor-test-image pushed in this pipeline.
    # A web pipeline on main rebuilds and moves latest.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *casdoor_test_inputs
      variables:
        CASDOOR_TEST_TAG: $CI_COMMIT_SHA
    - if: $CI_PIPELINE_SOURCE == "web"
      variables:
        CASDOOR_TEST_TAG: $CI_COMMIT_SHA
    - !reference [.code_change_rules, rules]

# ============================================================================
# Build Stage
# ============================================================================

# Build Docker image and push to registry
# On main pushes: builds :$CI_COMMIT_SHA. On version tags (created by
# check-version): retags that image with the version number and 'latest'.
#
# Inherits image/services/script from the release component's .build-docker.
# We override before_script to keep the component's setup (docker login,
# buildx create) AND add our project-specific JWT key decoding — !reference
# merges them; a plain `before_script:` list would replace the component's.
build-docker:
  before_script:
    - !reference [.build-docker, before_script]
    - echo $token_jwt_key | base64 -d > ./token_jwt_key.pem

